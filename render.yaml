# Render Blueprint — deploy automático en cada push a main.
# Importa este archivo desde https://dashboard.render.com/blueprints
# o usa la Render API. Las variables sensibles (Supabase keys,
# tokens OAuth) se configuran como secret en el dashboard o vía API.

services:
  - type: web
    name: unified-inbox
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      # Supabase + OAuth secrets se gestionan en el dashboard Render
      # como "Environment Variables" para no exponer en el repo.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADS_SYNC_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Claude API — redacción con IA del cuerpo de plantillas.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Secreto compartido para el cron de campañas programadas
      # (GET /api/broadcasts/cron con header x-cron-secret).
      - key: BROADCAST_CRON_SECRET
        sync: false
      # Shopify — conexión de tienda (OAuth + webhooks de carrito abandonado).
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-10"
      - key: SHOPIFY_SCOPES
        value: "read_orders,read_checkouts,read_customers"
      # Sentry — observabilidad de errores en producción.
      - key: SENTRY_DSN
        sync: false
      # Secreto compartido para crons de automatizaciones, flows
      # (resume + barrido), backfills de Meta y polling Gmail/Outlook.
      - key: AUTOMATION_CRON_SECRET
        sync: false
      # Secreto compartido para el cron de reintentos de flows pendientes.
      - key: FLOWS_RETRY_CRON_SECRET
        sync: false
      # Upstash Redis — rate limit distribuido. Sin estas variables el
      # limitador cae a memoria por proceso y deja pasar burst en
      # multi-réplica. Crear base en https://upstash.com.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Pilar automations — IDs configurables sin redeploy. Hay defaults
      # hardcoded en /api/cron/shopify-feedback y /api/cron/reengagement
      # apuntando a los UUIDs del workspace de Pilar; estas vars permiten
      # cambiarlos sin recompilar.
      - key: PILAR_WORKSPACE_ID
        sync: false
      - key: PILAR_FEEDBACK_AUTOMATION_ID
        sync: false
      - key: PILAR_REENGAGEMENT_AUTOMATION_ID
        sync: false

# ============================================================
# Cron jobs Pilar — recovery 2h, feedback delivered, re-engagement
# ============================================================
# Render Cron Services. Cada cron se autentica con AUTOMATION_CRON_SECRET
# vía scripts/cron-ping.mjs (que setea el header x-cron-secret).
#
# Crearlos desde el dashboard Render: New + Cron Job, runtime node, build
# `npm install`, command `node scripts/cron-ping.mjs <ruta>`. Setear
# BASE_URL (URL del servicio web) y CRON_SECRET (igual a
# AUTOMATION_CRON_SECRET en el servicio web).
#
# Documentado acá como referencia — Render Blueprints todavía no permite
# definir cron services en el mismo yaml que el web service.
#
#   - Cart recovery (cada hora):
#       node scripts/cron-ping.mjs api/cron/shopify-cart-recovery
#       schedule: "0 * * * *"
#
#   - Feedback post-entrega (cada hora, +30m offset para escalonar):
#       node scripts/cron-ping.mjs api/cron/shopify-feedback
#       schedule: "30 * * * *"
#
#   - Re-engagement 14d (una vez por día, 14:00 UTC ≈ 11 AR):
#       node scripts/cron-ping.mjs api/cron/reengagement
#       schedule: "0 14 * * *"
