# Render Blueprint — deploy automático en cada push a main.
# Importa este archivo desde https://dashboard.render.com/blueprints
# o usa la Render API. Las variables sensibles (Supabase keys,
# tokens OAuth) se configuran como secret en el dashboard o vía API.

services:
  # plan starter y NO free a propósito: el free se apaga tras 15 min sin
  # tráfico entrante, y una instancia dormida no corre el reloj de los trabajos
  # periódicos ni contesta un webhook sin ~50 s de arranque en frío. Con la
  # bandeja en tiempo real eso no es aceptable. Además, mientras esto sea free
  # hay que pagar un cron externo sólo para mantenerlo despierto: los 7 USD del
  # starter se ahorran ese cron y traen 5× CPU.
  - type: web
    name: riverz-crm
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Supabase + OAuth secrets se gestionan en el dashboard Render
      # como "Environment Variables" para no exponer en el repo.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADS_SYNC_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Shared secret echoed as `clientState` on every Microsoft Graph push
      # notification (Outlook inbound). REQUIRED: without it startOutlookWatch
      # creates no subscription AND the webhook fail-closes and drops every
      # notification, so no Outlook email ever reaches the inbox. Set to a long
      # random string in the Render dashboard.
      - key: OUTLOOK_PUSH_CLIENT_STATE
        sync: false
      # Claude API — redacción con IA del cuerpo de plantillas.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Firecrawl — scrape de la web de la marca para generar/actualizar
      # el conocimiento del agente IA. Obligatoria: sin esta var el scrape
      # responde 500. Crear key en https://firecrawl.dev.
      - key: FIRECRAWL_API_KEY
        sync: false
      # Secreto compartido para el cron de campañas programadas
      # (GET /api/broadcasts/cron con header x-cron-secret).
      - key: BROADCAST_CRON_SECRET
        sync: false
      # Shopify — conexión de tienda (OAuth + webhooks de carrito abandonado).
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-10"
      - key: SHOPIFY_SCOPES
        value: "read_orders,read_checkouts,read_customers,read_products"
      # Sentry — observabilidad de errores en producción.
      - key: SENTRY_DSN
        sync: false
      # Secreto compartido para crons de automatizaciones, flows
      # (resume + barrido), backfills de Meta y polling Gmail/Outlook.
      - key: AUTOMATION_CRON_SECRET
        sync: false
      # Secreto compartido para el cron de reintentos de flows pendientes.
      - key: FLOWS_RETRY_CRON_SECRET
        sync: false
      # Upstash Redis — rate limit distribuido. Sin estas variables el
      # limitador cae a memoria por proceso y deja pasar burst en
      # multi-réplica. Crear base en https://upstash.com.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Hops de proxy confiables para resolver la IP real del cliente desde
      # X-Forwarded-For (rate-limit per-IP). Render appendea la IP real al
      # final, así que 1 (el proxy frontal) es correcto. Subir SOLO si se
      # agrega otro proxy/CDN (p.ej. Cloudflare) delante de Render.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Pilar automations — IDs configurables sin redeploy. Hay defaults
      # hardcoded en /api/cron/shopify-feedback y /api/cron/reengagement
      # apuntando a los UUIDs del workspace de Pilar; estas vars permiten
      # cambiarlos sin recompilar.
      - key: PILAR_WORKSPACE_ID
        sync: false
      - key: PILAR_FEEDBACK_AUTOMATION_ID
        sync: false
      - key: PILAR_REENGAGEMENT_AUTOMATION_ID
        sync: false
      # Meta (Facebook Login for Business) — IDs públicos para el connect
      # in-app vía JS SDK + token de verificación de webhooks. Sin estos, el
      # connect de FB/IG cae al pegado manual de token (que App Review rechaza)
      # y el handshake de webhooks falla.
      - key: NEXT_PUBLIC_META_APP_ID
        sync: false
      - key: NEXT_PUBLIC_META_ES_CONFIG_ID
        sync: false
      - key: NEXT_PUBLIC_META_LOGIN_CONFIG_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      # Voice AI (Telnyx SIP ↔ LiveKit). The web service dispatches the agent
      # and serves the internal /api/internal/voice/* endpoints; the actual
      # telephony/media runs in the voice-worker below. ELEVENLABS_API_KEY is
      # shared with the worker (also used by the in-app voice preview).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_SIP_OUTBOUND_TRUNK_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Fish Audio (S2.1) — TTS alternative, selectable in /admin/voz. Shared
      # with the worker; also used by the in-app voice preview.
      - key: FISH_API_KEY
        sync: false
      # Shared secret for the worker → web internal endpoints
      # (Authorization: Bearer). Set the SAME value on the voice-worker.
      - key: VOICE_WORKER_SECRET
        sync: false
      # Platform (super) admin allowlist — EXTRA emails that can open the
      # platform panel (riverz.co/admin), on top of the built-in Riverz team
      # list in src/lib/auth/platform-admin.ts. Optional and additive: leaving
      # these unset never locks the team out. Comma-separated; NEXT_PUBLIC_* is
      # the client mirror that only toggles the sidebar link.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS
        sync: false

# ============================================================
# Voice AI worker — LiveKit Agents (Python). Persistent background process
# (NOT serverless): registers with LiveKit over an outbound WSS connection,
# receives dispatched jobs, dials via the Telnyx SIP trunk, runs the
# STT→LLM→TTS pipeline, and reports transcripts/outcomes back to the web
# service. No public ingress needed.
# ============================================================
  # plan standard obligatorio, no es holgura: en starter (512 MB) Render lo mata
  # con oomKilled a los ~45 s, apenas LiveKit arranca el proceso de inferencia
  # que carga onnxruntime y el detector multilingüe de turnos. La escalera de
  # instancias no tiene nada entre 512 MB y 2 GB, así que standard es el piso.
  - type: worker
    name: voice-worker
    runtime: docker
    plan: standard
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./voice-worker/Dockerfile
    dockerContext: ./voice-worker
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_SIP_OUTBOUND_TRUNK_ID
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Web service base URL (https://…) the worker calls for context/result/tool.
      - key: RIVERZ_BASE_URL
        sync: false
      # Must match VOICE_WORKER_SECRET on the web service.
      - key: VOICE_WORKER_SECRET
        sync: false
      # Call recording (optional) — S3-compatible bucket (e.g. Supabase Storage)
      # LiveKit Egress uploads to. If any is missing, recording is skipped.
      - key: RECORDING_S3_BUCKET
        sync: false
      - key: RECORDING_S3_ENDPOINT
        sync: false
      - key: RECORDING_S3_REGION
        sync: false
      - key: RECORDING_S3_ACCESS_KEY
        sync: false
      - key: RECORDING_S3_SECRET_KEY
        sync: false

# ============================================================
# Sin cron jobs, a propósito.
#
# Los trabajos periódicos corren dentro del servicio web: el inventario y sus
# horarios están en src/lib/cron/schedule.ts y el reloj en
# src/lib/cron/scheduler.ts. Render cobra un MÍNIMO de 1 USD/mes por cada cron
# job y no tiene plan gratuito para ese tipo de servicio, así que los 24 crons
# que había antes costaban ~24 USD/mes antes de ejecutar nada.
#
# Durante un tiempo quedó UN cron (`cron-heartbeat`) golpeando /api/cron/tick
# cada 10 min, pero existía sólo para que la instancia free no se durmiera. Con
# el web en starter no se duerme, así que se borró: el reloj vive y late solo
# mientras el proceso está arriba.
#
# Si algún día el web vuelve a free, hay que volver a crear ese cron o los
# trabajos dejan de correr en cuanto la instancia se apague.
#
# /api/cron/tick sigue existiendo como diagnóstico: devuelve si el reloj está
# vivo, cuántos trabajos hay y cuáles están corriendo en este momento.
# ============================================================
