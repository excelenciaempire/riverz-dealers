# Render Blueprint — deploy automático en cada push a main.
# Importa este archivo desde https://dashboard.render.com/blueprints
# o usa la Render API. Las variables sensibles (Supabase keys,
# tokens OAuth) se configuran como secret en el dashboard o vía API.

services:
  - type: web
    name: unified-inbox
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Supabase + OAuth secrets se gestionan en el dashboard Render
      # como "Environment Variables" para no exponer en el repo.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADS_SYNC_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Shared secret echoed as `clientState` on every Microsoft Graph push
      # notification (Outlook inbound). REQUIRED: without it startOutlookWatch
      # creates no subscription AND the webhook fail-closes and drops every
      # notification, so no Outlook email ever reaches the inbox. Set to a long
      # random string in the Render dashboard.
      - key: OUTLOOK_PUSH_CLIENT_STATE
        sync: false
      # Claude API — redacción con IA del cuerpo de plantillas.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Firecrawl — scrape de la web de la marca para generar/actualizar
      # el conocimiento del agente IA. Obligatoria: sin esta var el scrape
      # responde 500. Crear key en https://firecrawl.dev.
      - key: FIRECRAWL_API_KEY
        sync: false
      # Secreto compartido para el cron de campañas programadas
      # (GET /api/broadcasts/cron con header x-cron-secret).
      - key: BROADCAST_CRON_SECRET
        sync: false
      # Shopify — conexión de tienda (OAuth + webhooks de carrito abandonado).
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-10"
      - key: SHOPIFY_SCOPES
        value: "read_orders,read_checkouts,read_customers,read_products"
      # Sentry — observabilidad de errores en producción.
      - key: SENTRY_DSN
        sync: false
      # Secreto compartido para crons de automatizaciones, flows
      # (resume + barrido), backfills de Meta y polling Gmail/Outlook.
      - key: AUTOMATION_CRON_SECRET
        sync: false
      # Secreto compartido para el cron de reintentos de flows pendientes.
      - key: FLOWS_RETRY_CRON_SECRET
        sync: false
      # Upstash Redis — rate limit distribuido. Sin estas variables el
      # limitador cae a memoria por proceso y deja pasar burst en
      # multi-réplica. Crear base en https://upstash.com.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Hops de proxy confiables para resolver la IP real del cliente desde
      # X-Forwarded-For (rate-limit per-IP). Render appendea la IP real al
      # final, así que 1 (el proxy frontal) es correcto. Subir SOLO si se
      # agrega otro proxy/CDN (p.ej. Cloudflare) delante de Render.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Pilar automations — IDs configurables sin redeploy. Hay defaults
      # hardcoded en /api/cron/shopify-feedback y /api/cron/reengagement
      # apuntando a los UUIDs del workspace de Pilar; estas vars permiten
      # cambiarlos sin recompilar.
      - key: PILAR_WORKSPACE_ID
        sync: false
      - key: PILAR_FEEDBACK_AUTOMATION_ID
        sync: false
      - key: PILAR_REENGAGEMENT_AUTOMATION_ID
        sync: false
      # Meta (Facebook Login for Business) — IDs públicos para el connect
      # in-app vía JS SDK + token de verificación de webhooks. Sin estos, el
      # connect de FB/IG cae al pegado manual de token (que App Review rechaza)
      # y el handshake de webhooks falla.
      - key: NEXT_PUBLIC_META_APP_ID
        sync: false
      - key: NEXT_PUBLIC_META_ES_CONFIG_ID
        sync: false
      - key: NEXT_PUBLIC_META_LOGIN_CONFIG_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      # Voice AI (Telnyx SIP ↔ LiveKit). The web service dispatches the agent
      # and serves the internal /api/internal/voice/* endpoints; the actual
      # telephony/media runs in the voice-worker below. ELEVENLABS_API_KEY is
      # shared with the worker (also used by the in-app voice preview).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_SIP_OUTBOUND_TRUNK_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Shared secret for the worker → web internal endpoints
      # (Authorization: Bearer). Set the SAME value on the voice-worker.
      - key: VOICE_WORKER_SECRET
        sync: false

# ============================================================
# Voice AI worker — LiveKit Agents (Python). Persistent background process
# (NOT serverless): registers with LiveKit over an outbound WSS connection,
# receives dispatched jobs, dials via the Telnyx SIP trunk, runs the
# STT→LLM→TTS pipeline, and reports transcripts/outcomes back to the web
# service. No public ingress needed.
# ============================================================
  - type: worker
    name: voice-worker
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./voice-worker/Dockerfile
    dockerContext: ./voice-worker
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_SIP_OUTBOUND_TRUNK_ID
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Web service base URL (https://…) the worker calls for context/result/tool.
      - key: RIVERZ_BASE_URL
        sync: false
      # Must match VOICE_WORKER_SECRET on the web service.
      - key: VOICE_WORKER_SECRET
        sync: false

# ============================================================
# Cron jobs — Render Cron Services declared in the blueprint so the
# inventory is enforceable in-repo (instead of living only in the
# Render dashboard). Each cron pings the web service via
# scripts/cron-ping.mjs with the right shared secret.
#
# All crons share `BASE_URL` pointing at the web service. Each sets
# `CRON_SECRET` from the appropriate env var (most use
# AUTOMATION_CRON_SECRET; broadcasts uses BROADCAST_CRON_SECRET).
# ============================================================
  - type: cron
    name: cron-shopify-cart-recovery
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/shopify-cart-recovery
    schedule: "0 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-shopify-feedback
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/shopify-feedback
    schedule: "30 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-reengagement
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/reengagement
    schedule: "0 14 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Follow-ups inteligentes: si el cliente no responde, el asistente le
  # escribe un seguimiento contextual. El propio endpoint respeta el delay
  # por-agente; correr cada 30 min da buena latencia sin spamear.
  - type: cron
    name: cron-ai-followups
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/ai-followups
    schedule: "*/30 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Refresca el token largo (~60d) de Facebook Login antes de que muera, así
  # las conexiones FB/IG/Messenger no se caen solas. Diario (ventana de ~5d).
  - type: cron
    name: cron-meta-token-refresh
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/meta-token-refresh
    schedule: "0 6 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Purga real de PII de workspaces eliminados (N días tras soft-delete).
  - type: cron
    name: cron-pii-purge
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/pii-purge
    schedule: "0 3 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-flows-resume
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/flows-resume
    schedule: "* * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-gmail-poll
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/gmail-poll
    schedule: "*/5 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Agente de Instagram — envía DMs en cola, detecta respuestas/captura leads
  # y atribuye conversiones de Shopify para las campañas activas.
  - type: cron
    name: cron-instagram-agent
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/instagram-agent
    schedule: "*/2 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Enriquecimiento externo de perfiles de Instagram (Apify): analiza el perfil
  # PÚBLICO (bio + posts + fotos) para personalizar los DMs. Aislado de las
  # credenciales de Meta; solo cuentas públicas; respeta opt-out. Ritmo lento
  # (scraping rate-limited); no-op si falta APIFY_TOKEN.
  - type: cron
    name: cron-instagram-external-enrich
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/instagram-external-enrich
    schedule: "*/10 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-gmail-watch
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/gmail-watch
    schedule: "0 0 */5 * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-outlook-poll
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/outlook-poll
    schedule: "*/5 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-outlook-watch
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/outlook-watch
    schedule: "0 */12 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-meta-contact-names
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/meta-contact-names
    schedule: "0 */6 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-meta-dm-backfill
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/meta-dm-backfill
    schedule: "0 5 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Re-applies + verifies Meta webhook field subscriptions so the inbox
  # never silently stops receiving DMs/comments (Meta unsubscribes a page
  # after sustained webhook errors and never re-subscribes on its own).
  - type: cron
    name: cron-meta-webhook-subscriptions
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/meta-webhook-subscriptions
    schedule: "0 */6 * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Two-way comment sync (pull side): re-reads recent FB/IG comments and
  # reflects native deletes/hides back into the inbox. Instagram pushes no
  # comment lifecycle webhook, so this cron is the only IG sync path (Facebook
  # also gets it in real time via feed webhooks). Uses AUTOMATION_CRON_SECRET.
  - type: cron
    name: cron-comment-sync
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/comment-sync
    schedule: "*/10 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: cron-broadcasts
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/broadcasts/cron
    schedule: "* * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Voice AI queue: dispatches due queued calls (respecting calling window +
  # limits) and sweeps stuck calls. Every minute. Uses AUTOMATION_CRON_SECRET.
  - type: cron
    name: cron-voice-calls
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/voice-calls
    schedule: "* * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # Watchdog de entrega: marca los mensajes que Meta dejó en 'sent' para
  # siempre (nunca mandó 'delivered' ni 'failed') como "sin confirmar", para
  # que la bandeja no mienta que llegaron. Usa AUTOMATION_CRON_SECRET.
  - type: cron
    name: cron-delivery-watchdog
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node scripts/cron-ping.mjs api/cron/delivery-watchdog
    schedule: "*/30 * * * *"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

# Note: if the team prefers the dashboard for cron config, the legacy
# documentation is preserved here for reference:
#   - Cart recovery: schedule "0 * * * *"
#   - Feedback:      schedule "30 * * * *"
#   - Re-engagement: schedule "0 14 * * *"
