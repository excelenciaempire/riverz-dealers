name: Gmail watch renew

# Gmail stops pushing 7 days after the last users.watch call. We hit
# the renew endpoint every 6 days so there's always at least 24h of
# headroom — a failed GH Actions run still has a day to retry before
# the inbox would go quiet.
#
# Secrets used:
#   - GMAIL_WATCH_URL    /api/cron/gmail-watch on prod
#   - CRON_PING_SECRET   matches AUTOMATION_CRON_SECRET in Render env

on:
  schedule:
    # 03:15 every 6 days. Concrete hour rather than every-N-days from
    # repo creation so the schedule stays predictable across forks.
    - cron: "15 3 */6 * *"
  workflow_dispatch:

concurrency:
  group: gmail-watch-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit gmail-watch endpoint
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "x-cron-secret: ${{ secrets.CRON_PING_SECRET }}" \
            "${{ secrets.GMAIL_WATCH_URL }}")
          echo "$response"
