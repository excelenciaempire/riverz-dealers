name: Ads sync

# Refreshes the post_id → ad_id mapping for every connected FB/IG
# comment channel. Without this, comments on paid posts come in but
# the inbox can't flag them as "Anuncio" since the webhook payload
# doesn't carry the ad id directly.
#
# Every 30 min is fine — the mapping is a cache, and Meta's Marketing
# API doesn't appreciate hammering. GitHub cron's latency drift
# (5-15 min) is irrelevant here.
#
# Secrets used:
#   - ADS_SYNC_URL     /api/meta/ads-sync on prod
#   - ADS_SYNC_SECRET  matches ADS_SYNC_SECRET in Render env (also
#                      passed as ?secret= since the endpoint uses
#                      that style instead of a header)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ads-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit ads-sync endpoint
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            "${{ secrets.ADS_SYNC_URL }}?secret=${{ secrets.ADS_SYNC_SECRET }}")
          echo "$response"
