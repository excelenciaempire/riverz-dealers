name: Outlook watch renew

# Microsoft Graph mailbox subscriptions expire after at most 3 days. We
# re-arm every 2 days so there's always ~1 day of headroom before push
# would go silent. Mirrors gmail-watch-renew.yml.
#
# Secrets used:
#   - OUTLOOK_WATCH_URL  /api/cron/outlook-watch on prod
#   - CRON_PING_SECRET   matches AUTOMATION_CRON_SECRET in Render env

on:
  schedule:
    # 03:35 every 2 days.
    - cron: "35 3 */2 * *"
  workflow_dispatch:

concurrency:
  group: outlook-watch-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit outlook-watch endpoint
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "x-cron-secret: ${{ secrets.CRON_PING_SECRET }}" \
            "${{ secrets.OUTLOOK_WATCH_URL }}")
          echo "$response"
